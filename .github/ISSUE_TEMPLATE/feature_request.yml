name: "✨ Feature Request"
description: "Suggest an idea or enhancement for Adaptive Wiggle Cursor"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature or enhancement for Adaptive Wiggle Cursor!

  - type: textarea
    id: problem
    attributes:
      label: "Problem or Limitation"
      description: "Is your feature request related to a problem or limitation? Please describe."
      placeholder: "I'm always frustrated when..."
    validations:
      required: false

  - type: textarea
    id: proposal
    attributes:
      label: "Proposed Solution / Desired Behavior"
      description: "A clear and concise description of what you want to happen."
      placeholder: "I would like the extension to..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "A clear and concise description of any alternative solutions or features you've considered."
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: "Additional Context / References"
      description: "Add any other context, screenshots, or links (e.g. KDE/KWin implementations) about the feature request here."
    validations:
      required: false
